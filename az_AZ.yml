#   Инструкции, которые пишутся в начале игры в зависимости от режима
instruction:
  default:  # (Название секции ни на что не влияет. Но влияет их порядок)
    # Шапблон с регулярными выражениями, который определяет, каким режимам принадлежит инструкция
    pattern: ".*"  # Для любых режимов
    message: |
      <yellow>Admini çağırmaq: <aqua>/calladmin
      <yellow>Dəstəyi yenə seçmək: <aqua>/kit
      <yellow>30 saniyəlik fasilə götürmək: <aqua>/timeout
      <white>Siz <yellow><b>msl.su serverdə oynayırsınız
  ranked:
    pattern: "pvp-\\dv\\d"  # Для режимов, в названии которых есть "pvp-1v1", "pvp-2v2" и т.д.
    message: |
      <yellow>Ranked mode
      <yellow>instruction
  fdjfdjkdfjkfjkd:
    pattern: "axepvp-\\dv\\d|swordpvp-\\dv\\d|uhcpvp-\\dv\\d"  # Для всех разновидностей режимов Axe&Shield, Swords и UHC
    message: |
      <yellow>Axe & Sword & UHC
      <yellow>Tutorial
  zakupka-2v2:
    pattern: "zakupka-2v2" # Конкретный режим "zakupka-2v2"
    message: |
      <yellow>Zakupka 2v2 vaaay
