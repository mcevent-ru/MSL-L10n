#   Ойын басталған кезде көрсетілетін нұсқаулықтар режимге байланысты
instruction:
  default:  # (Секция аты әсер етпейді, тек реттілік маңызды)
    pattern: ".*"  # Барлық режимдерге арналған
    message: |
      <yellow>Әкімшіні шақыру: <aqua>/calladmin
      <yellow>Наборды қайта таңдау: <aqua>/kit
      <yellow>30 секундқа үзіліс алу: <aqua>/timeout
      <white>Сіз ойнап отырсыз: <yellow><b>msl.su
  ranked:
    pattern: "pvp-\\dv\\d"  # "pvp-1v1", "pvp-2v2" және т.б. атаулары бар режимдерге
    message: |
      <yellow>Рейтингтік режим
      <yellow>Нұсқаулық
  axepvp_sword_uhc:
    pattern: "axepvp-\\dv\\d|swordpvp-\\dv\\d|uhcpvp-\\dv\\d"  # Axe&Shield, Swords және UHC барлық түрлеріне
    message: |
      <yellow>Топор, Меч және UHC
      <yellow>Оқыту нұсқаулығы
  zakupka-2v2:
    pattern: "zakupka-2v2"  # Нақты "zakupka-2v2" режиміне
    message: |
      <yellow>Закупка 2v2, қуаныш! 🎉

