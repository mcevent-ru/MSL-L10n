instruction:
  zakupka:
    pattern: "zakupka\\dv\\d"
    message: |
      <yellow>Call an admin: <aqua>/calladmin
      <yellow>Reselect a kit: <aqua>/kit
      <yellow>Take a 30-second pause: <aqua>/timeout
      <yellow>Rollback a round: <aqua>/rollback
      <white>You are playing on <yellow><b>msl.su
      <gold>MODE DESCRIPTION
      <white>Buy items every round using gold in your inventory.
      <white>Bought items can't be bought twice in a row - every item has a single-round cooldown.
      <white>You can re-open buy-menu using <gold>/kit<white>.
  default:  # (Section name doesn't affect functionality, but order does)
    # Regex pattern to determine which modes this instruction applies to
    pattern: ".*"  # For any mode
    message: |
      <yellow>Call an admin: <aqua>/calladmin
      <yellow>Reselect a kit: <aqua>/kit
      <yellow>Take a 30-second pause: <aqua>/timeout
      <yellow>Rollback a round: <aqua>/rollback
