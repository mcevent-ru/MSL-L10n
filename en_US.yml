#   Journal pages (defined in journal.yml)
journal:
- |
  <b>         <black><u>Year 2025<reset>

  <gradient:#b55353:#919144>Well, a lot has happened this year. Specifically, many game modes were added and <black>tier-testing</black> was approved for most of them. The server was also translated into several languages. And many other things.
- |
  <b>        <black><u>19/08/2024<reset>

  <black><b> • </black><gradient:#919144:#b55353>The server was updated to <black>1.21</black>.
  <black><b> • </black>A <black>zone</black> now appears during gameplay that causes damage outside of it.
  <black><b> • </black>Added the <black>/calladmin</black> command to call an admin.
- |
  <b>        <black><u>11/01/2024<reset>

  <black><b> • </black><gradient:#b55353:#919144>Implemented a <black>timeout</black> (break) system during gameplay.
  <black><b> • </black>Added the ability to <black>rejoin</black> the game after leaving the server.



  More details on <#7289da>Discord</#7289da>:
             <dark_gray><u><i><hover:show_text:News link><click:open_url:https://discord.com/channels/1008694439285370910/1187825467986825329/1194782514829598741>LINK
- |
  <b>        <black><u>24/12/2023<reset>

  <b> • </b><gradient:#919144:#b55353>A <black>journal</black> was added to the server, which you are currently reading. It will notify about <black>news</black> and <black>updates</black> for such a cool and ambitious server as <b><gradient:#7a6c05:#a69207>MSL</b>!

