- |
  <b>         <black><u>2025 год<reset>

  <gradient:#b55353:#919144>Ну за этот год произошло много вещей. В частности, было добавлено много режимов и для многих из них был одобрен <black>тир-тестинг</black>. Также сервер был переведен на несколько языков. Ну и много чего.
- |
  <b>         <black><u>19.08.2024<reset>

  <black><b> • </black><gradient:#919144:#b55353>Сервер был обновлен до <black>1.21</black>.
  <black><b> • </black>Теперь во время игры появляется <black>зона</black>, за пределами которой наносится урон.
  <black><b> • </black>Добавлена команда <black>/calladmin</black>, с помощью которой можно вызвать админа.
- |
  <b>          <black><u>11.01.2024<reset>

  <black><b> • </black><gradient:#b55353:#919144>Реализована система <black>тайм-аутов</black> (перерывов) во время игры.
  <black><b> • </black>Добавлена возможность <black>возвращаться</black> в игру, если вышел из сервера.

